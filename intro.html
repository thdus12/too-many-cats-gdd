<title>Too Many Cats! — 인트로</title>

<style>
  :root {
    --ink: #E8EAED;
    --ink-2: #9AA3AE;
    --panel: rgba(10, 13, 18, .88);
    --edge: rgba(255, 255, 255, .16);
    --gold: #FFC01F;
    --orange: #F26B1E;
    --pink: #F4657E;
    --page: #14171C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 16px 40px;
    min-height: 100vh;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 15px;
    font-weight: 650;
    margin: 0;
    letter-spacing: .01em;
  }

  header p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-2);
  }

  /* ── 화면. 640x360 을 그대로 확대한다 ── */

  #stage {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    position: relative;
    background: #000;
    border: 1px solid var(--edge);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    image-rendering: pixelated;
  }

  #bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    image-rendering: pixelated;
  }

  /* 그림이 없을 때 자리만 알려 준다 */
  #bgSlot {
    position: absolute;
    inset: 0;
    display: none;
    align-items: flex-start;
    justify-content: flex-start;
    flex-direction: column;
    gap: 2px;
    padding: 14px 16px;
    color: rgba(255, 255, 255, .26);
    font-size: 11.5px;
    letter-spacing: .04em;
    background:
      repeating-linear-gradient(45deg,
        rgba(255,255,255,.022) 0 12px,
        transparent 12px 24px);
  }

  #bgSlot b { font-weight: 600; font-size: 13px; color: rgba(255,255,255,.4); }

  /* 배경 위에 얹는 그림. 안전 영역 안에 둔다 */
  #ov {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%);
    width: 28%;
    aspect-ratio: 1;
    display: none;
    align-items: center;
    justify-content: center;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: pixelated;
    border: 1px dashed rgba(255, 255, 255, .18);
    border-radius: 6px;
    font-size: 12px;
    letter-spacing: .04em;
    color: rgba(255, 255, 255, .34);
  }

  /* 안전 영역 — 대사창이 덮는 아래 1/3 */
  #safe {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 66.667%;
    border-bottom: 1px dashed rgba(255, 192, 31, .34);
    pointer-events: none;
    display: none;
  }

  #safe::after {
    content: "안전 영역 640 × 240";
    position: absolute;
    right: 8px; bottom: 6px;
    font-size: 10.5px;
    letter-spacing: .05em;
    color: rgba(255, 192, 31, .6);
  }

  /* ── 대사창 ── */

  /*
    640×360 기준으로 잡은 값이다.
    이름 한 줄(12px) + 본문 두 줄(16px × 1.5) + 안팎 여백 = 약 108px.
    거기에 여유를 줘서 112px = 화면의 31%. 아래 여백 2% 를 합쳐 정확히 아래 1/3 이다.
    그래야 위 2/3(640×240)이 그림 영역으로 딱 떨어진다.
  */
  #box {
    position: absolute;
    left: 2.5%; right: 2.5%; bottom: 2%;
    height: 31%;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 5px;
    display: flex;
    align-items: center;
    gap: 2.4%;
    padding: 2% 2.6%;
    backdrop-filter: blur(2px);
  }

  #face {
    flex: 0 0 auto;
    aspect-ratio: 1;
    height: 100%;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 4px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: pixelated;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
    font-size: 10px;
    color: rgba(255, 255, 255, .34);
    letter-spacing: .03em;
  }

  /* 글이 위에 붙어 있으면 아래가 비어서 상자가 좁아 보인다. 가운데로 맞춘다. */
  #say {
    flex: 1 1 auto;
    min-width: 0;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2.2%;
  }

  #who {
    font-size: clamp(12px, 1.75vw, 17px);
    font-weight: 650;
    color: var(--gold);
    letter-spacing: .04em;
    min-height: 1em;
  }

  #text {
    font-size: clamp(15px, 2.55vw, 26px);
    line-height: 1.5;
    white-space: pre-wrap;
  }

  #caret {
    position: absolute;
    right: 14px; bottom: 10px;
    font-size: 12px;
    color: var(--ink-2);
  }

  /* ── 타이틀 카드 ── */

  #title {
    position: absolute;
    left: 0; right: 0; top: 0; bottom: 33%;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    pointer-events: none;
  }

  #title.on { display: flex; animation: drop .45s cubic-bezier(.2, 1.4, .4, 1); }

  @keyframes drop {
    from { transform: translateY(-16px) scale(.92); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  #title b {
    font-size: clamp(22px, 4.6vw, 46px);
    font-weight: 800;
    letter-spacing: -.01em;
    background: linear-gradient(180deg, var(--gold), var(--orange));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
  }

  #title i {
    font-style: normal;
    font-size: clamp(11px, 1.7vw, 17px);
    font-weight: 700;
    letter-spacing: .16em;
    color: #fff;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
  }

  #title u { text-decoration: none; color: var(--pink); font-size: clamp(22px, 4.6vw, 46px); }

  /* ── 조작 ── */

  #bar {
    width: 100%;
    max-width: 960px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    font: inherit;
    font-size: 12.5px;
    padding: 6px 13px;
    border-radius: 5px;
    border: 1px solid var(--edge);
    background: #1D2229;
    color: var(--ink);
    cursor: pointer;
  }

  button:hover { background: #262C34; }
  button[aria-pressed="true"] { background: #33404F; border-color: rgba(255,192,31,.4); }

  #meter {
    flex: 1 1 200px;
    min-width: 160px;
    height: 4px;
    border-radius: 2px;
    background: #262C34;
    overflow: hidden;
  }

  #meter div { height: 100%; width: 0; background: var(--gold); transition: width .12s linear; }

  #pos { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* ── 대본 목록 ── */

  #list {
    width: 100%;
    max-width: 960px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    overflow: hidden;
  }

  #list summary {
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--ink-2);
    cursor: pointer;
    background: #1A1F26;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }

  td {
    padding: 5px 10px;
    border-top: 1px solid rgba(255, 255, 255, .06);
    vertical-align: top;
  }

  tr.here { background: rgba(255, 192, 31, .1); }
  tr.cut td { border-top-color: rgba(255, 192, 31, .34); }

  td.n { color: #5C6773; width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  td.w { color: var(--gold); width: 62px; white-space: nowrap; }
  td.a { color: #6D7883; width: 128px; white-space: nowrap; font-size: 11px; }
  td.f { color: #6D7883; width: 108px; white-space: nowrap; font-size: 11px; }
  td.f.off { color: #3C444D; }
</style>

  <h1>Too Many Cats! — 인트로</h1>

</header>

": true, "text": "수의사 부른다.", "hold": 0, "bg": "bg-sick-cat", "face": "face-determined", "overlay": "", "title": false}, {"speaker": "수의사", "portrait": false, "text": "늦었습니다. 어디죠?", "hold": 0, "bg": "bg-sick-cat", "face": "face-determined", "overlay": "", "title": false}, {"speaker": "팀장", "portrait": true, "text": "할 일이 하나 늘었다.", "hold": 0, "bg": "bg-sick-cat", "face": "face-determined", "overlay": "", "title": false}, {"speaker": "팀장", "portrait": true, "text": "고친다.", "hold": 0, "bg": "bg-sick-cat", "face": "face-determined", "overlay": "", "title": false}]}, {"id": "story-ending", "trigger": "AfterLevel", "level": 10, "lines": [{"speaker": "상황실", "portrait": false, "text": "마지막 수송선 적재 완료.", "hold": 0, "bg": "bg-launch-pad", "face": "face-neutral", "overlay": "", "title": false}, {"speaker": "상황실", "portrait": false, "text": "…팀장님. 한 마리가 안 들어갑니다.", "hold": 0, "bg": "bg-launch-pad", "face": "face-neutral", "overlay": "", "title": false}, {"speaker": "팀장", "portrait": true, "text": "왜.", "hold": 0, "bg": "bg-launch-pad", "face": "face-neutral", "overlay": "", "title": false}, {"speaker": "상황실", "portrait": false, "text": "돌아보고 있습니다.", "hold": 1.2, "bg": "bg-launch-pad", "face": "face-shocked", "overlay": "", "title": false}, {"speaker": "팀장", "portrait": true, "text": "………", "hold": 1.2, "bg": "bg-launch-pad", "face": "face-shocked", "overlay": "", "title": false}, {"speaker": "팀장", "portrait": true, "text": "…보내.", "hold": 0, "bg": "bg-launch-pad", "face": "face-determined", "overlay": "", "title": false}, {"speaker": "", "portrait": false, "text": "— 발사 —", "hold": 1.5, "bg": "bg-launch-pad", "face": "face-relieved", "overlay": "", "title": false}, {"speaker": "집사", "portrait": false, "text": "팀장님. 우시는 거예요?", "hold": 0, "bg": "bg-launch-pad", "face": "face-relieved", "overlay": "", "title": false}, {"speaker": "팀장", "portrait": true, "text": "아니.", "hold": 0, "bg": "bg-launch-pad", "face": "face-relieved", "overlay": "", "title": false}, {"speaker": "팀장", "portrai   var ART = {};

  var SCENE = SCRIPT.scenes[0];          // 오프닝
  var LINES = SCENE.lines;
  var CPS = 30;                          // DialogueView 의 타자 속도

  var bg = document.getElementById('bg');
  var bgSlot = document.getElementById('bgSlot');
  var face = document.getElementById('face');
  var who = document.getElementById('who');
  var text = document.getElementById('text');
  var caret = document.getElementById('caret');
  var titleCard = document.getElementById('title');
  var box = document.getElementById('box');
  var ov = document.getElementById('ov');
  var stage = document.getElementById('stage');
  var meter = document.querySelector('#meter div');
  var pos = document.getElementById('pos');
  var rows = document.getElementById('rows');

  var index = 0;
  var revealed = 0;
  var holdLeft = 0;
  var auto = false;
  var last = 0;

  function paint() {
    var line = LINES[index];

    // 배경. 그림이 없으면 자리만 알려 준다 — 대사는 그대로 돈다.
    var image = ART[line.bg];
    if (image) {
      bg.style.backgroundImage = 'url("' + image + '")';
      bgSlot.style.display = 'none';
    } else {
      bg.style.backgroundImage = 'none';
      if (line.bg === 'bg-black') {
        bgSlot.style.display = 'none';
      } else {
        bgSlot.style.display = 'flex';
        bgSlot.querySelector('b').textContent = line.bg;
        bgSlot.querySelector('span').textContent = '아직 그림 없음';
      }
    }

    // 초상화는 팀장이 말할 때만.
    if (line.portrait) {
      face.style.display = 'flex';
      var portrait = ART[line.face];
      face.style.backgroundImage = portrait ? 'url("' + portrait + '")' : 'none';
      face.textContent = portrait ? '' : line.face.replace('face-', '');
    } else {
      face.style.display = 'none';
    }

    // 배경 위 그림. 없으면 안 그리고, 파일이 없으면 자리만 표시한다.
    if (line.overlay) {
      ov.style.display = 'flex';
      var art = ART[line.overlay];
      ov.style.backgroundImage = art ? 'url("' + art + '")' : 'none';
      ov.textContent = art ? '' : line.overlay;
      ov.style.borderStyle = art ? 'none' : 'dashed';
    } else {
      ov.style.display = 'none';
    }

    // 대사가 비어 있으면 상자를 안 그린다. 타이틀 카드다.
    box.style.display = line.text ? 'flex' : 'none';

    who.textContent = line.speaker;
    titleCard.classList.toggle('on', !!line.title);

    // 상자가 없으면 제목이 화면 한가운데로 온다.
    titleCard.style.bottom = line.text ? '33%' : '0';

    for (var i = 0; i < rows.children.length; i++) {
      rows.children[i].classList.toggle('here', i === index);
    }

    pos.textContent = (index + 1) + ' / ' + LINES.length;
    meter.style.width = ((index + 1) / LINES.length * 100) + '%';
  }

  function tick(now) {
    var dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
    last = now;

    var line = LINES[index];
    revealed += CPS * dt;

    var full = revealed >= line.text.length;
    text.textContent = full ? line.text : line.text.slice(0, Math.floor(revealed));

    if (holdLeft > 0) {
      holdLeft = Math.max(0, holdLeft - dt);
    }

    caret.style.opacity = full && holdLeft <= 0 ? (0.35 + 0.65 * Math.abs(Math.sin(now / 400))) : 0.12;

    // 자동 재생은 다 쓰고 뜸까지 지난 뒤 조금 더 기다린다.
    if (auto && full && holdLeft <= 0) {
      if (!tick.wait) { tick.wait = now + 700; }
      if (now >= tick.wait) { tick.wait = 0; advance(); }
    } else {
      tick.wait = 0;
    }

    requestAnimationFrame(tick);
  }

  function advance() {
    if (revealed < LINES[index].text.length) {
      revealed = 1e9;                    // 첫 입력은 "지금 줄을 다 보여 줘"
      return;
    }

    if (holdLeft > 0) { return; }        // 뜸은 넘기지 못한다. 스킵만 뚫는다.
    if (index >= LINES.length - 1) { return; }

    go(index + 1);
  }

  function go(next) {
    index = next;
    revealed = 0;
    holdLeft = LINES[index].hold;
    paint();
  }

  stage.addEventListener('click', advance);

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
    if (e.key === 'Escape') { go(LINES.length - 1); revealed = 1e9; holdLeft = 0; }
  });

  document.getElementById('replay').onclick = function () { go(0); };

  document.getElementById('auto').onclick = function () {
    auto = !auto;
    this.setAttribute('aria-pressed', auto);
  };

  document.getElementById('guide').onclick = function () {
    var on = document.getElementById('safe').style.display !== 'block';
    document.getElementById('safe').style.display = on ? 'block' : 'none';
    this.setAttribute('aria-pressed', on);
  };

  // 대본 목록. 배경이 바뀌는 줄에 선을 긋는다.
  LINES.forEach(function (line, i) {
    var tr = document.createElement('tr');
    if (i === 0 || line.bg !== LINES[i - 1].bg) { tr.className = 'cut'; }

    var cut = (i === 0 || line.bg !== LINES[i - 1].bg) ? line.bg : '';
    var faced = line.portrait ? line.face.replace('face-', '') : '—';

    tr.innerHTML =
      '<td class="n">' + (i + 1) + '</td>' +
      '<td class="w">' + (line.speaker || '') + '</td>' +
      '<td>' + line.text.replace(/</g, '&lt;') + (line.title ? '  <b style="color:#FFC01F">◆ 타이틀</b>' : '') + '</td>' +
      '<td class="a">' + cut + '</td>' +
      '<td class="f' + (line.portrait ? '' : ' off') + '">' + faced + '</td>' +
      '<td class="f' + (line.overlay ? '' : ' off') + '">' + (line.overlay ? line.overlay.replace('ov-', '') : '—') + '</td>';

    tr.onclick = function () { go(i); };
    tr.style.cursor = 'pointer';
    rows.appendChild(tr);
  });

  // #12 로 특정 줄부터. 어느 컷이 이상한지 지목해서 보기 위한 것이다.
  function fromHash() {
    var n = parseInt((location.hash || '').replace('#', ''), 10);
    return isFinite(n) && n >= 1 && n <= LINES.length ? n - 1 : 0;
  }

  window.addEventListener('hashchange', function () { go(fromHash()); });

  go(fromHash());
  requestAnimationFrame(tick);
</script>
